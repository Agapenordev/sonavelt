# Bump `version` in Cargo.toml and push to main: this builds Sonavelt for Linux and Windows and
# publishes the GitHub release vX.Y.Z, which installed copies then offer as an in-app update.
# Run it by hand with "dry run" on to build and package without publishing.

name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only, don't publish
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # the oldest supported runner: binaries built against its glibc (2.35) run on newer systems too
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: System libraries
        if: steps.version.outputs.exists == 'false' || inputs.dry_run
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false' || inputs.dry_run

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false' || inputs.dry_run

      - name: Test and build
        if: steps.version.outputs.exists == 'false' || inputs.dry_run
        run: |
          cargo test
          cargo build --release

      - name: Package
        if: steps.version.outputs.exists == 'false' || inputs.dry_run
        run: |
          v=${{ steps.version.outputs.version }}
          dir=sonavelt-$v-x86_64-linux
          mkdir -p dist/$dir
          cp target/release/sonavelt README.md LICENSE dist/$dir/
          cp docs/logo.png dist/$dir/sonavelt.png
          tar -C dist -czf dist/$dir.tar.gz $dir
          # the in-app updater downloads exactly this file name
          cp target/release/sonavelt dist/sonavelt-x86_64-linux
          cd dist && sha256sum $dir.tar.gz sonavelt-x86_64-linux > SHA256SUMS && cat SHA256SUMS

      - name: Keep build as artifact (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: sonavelt-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/sonavelt-x86_64-linux
            dist/SHA256SUMS

      - name: Publish release
        if: steps.version.outputs.exists == 'false' && !inputs.dry_run
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" --target "$GITHUB_SHA" --title "Sonavelt $v" --generate-notes \
            --notes "[Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)" \
            dist/sonavelt-$v-x86_64-linux.tar.gz dist/sonavelt-x86_64-linux dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    # adds the Windows build to the release the Linux job just published
    needs: release
    if: needs.release.outputs.exists == 'false' || inputs.dry_run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test and build
        run: |
          cargo test
          cargo build --release
          New-Item -ItemType Directory -Path unsigned | Out-Null
          Copy-Item target/release/sonavelt.exe unsigned/

      # Signing runs once SignPath is set up (see CODE_SIGNING.md): the repository variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG and the secret
      # SIGNPATH_API_TOKEN. Until then the release ships unsigned, as before.
      - name: Upload for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: sonavelt-windows-unsigned
          path: unsigned/sonavelt.exe

      - name: Sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.release.outputs.version }}"
          wait-for-completion: true
          # every release waits for a person to approve it on SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.release.outputs.version }}"
          $exe = if (Test-Path signed/sonavelt.exe) { "signed/sonavelt.exe" } else { "unsigned/sonavelt.exe" }
          Write-Output "Packaging $exe"
          $dir = "sonavelt-$v-x86_64-windows"
          New-Item -ItemType Directory -Path "dist/$dir" | Out-Null
          Copy-Item $exe, README.md, LICENSE, CODE_SIGNING.md "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"
          # the in-app updater downloads exactly this file name
          Copy-Item $exe dist/sonavelt-x86_64-windows.exe
          Get-FileHash "dist/$dir.zip", dist/sonavelt-x86_64-windows.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS-windows

      - name: Keep build as artifact (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: sonavelt-${{ needs.release.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/sonavelt-x86_64-windows.exe
            dist/SHA256SUMS-windows

      - name: Add to release
        if: needs.release.outputs.exists == 'false' && !inputs.dry_run
        shell: pwsh
        run: gh release upload "v${{ needs.release.outputs.version }}" (Get-ChildItem dist/*.zip).FullName dist/sonavelt-x86_64-windows.exe dist/SHA256SUMS-windows
        env:
          GH_TOKEN: ${{ github.token }}
