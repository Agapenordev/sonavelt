[package]
name = "sonavelt"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "A fast, native music player for Linux and Windows: YouTube, internet radio and your own files, with synced lyrics"
license = "MIT"
repository = "https://github.com/Agapenordev/sonavelt"

[dependencies]
cpal = "0.18"
dirs = "6"
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "ico"] }
lofty = "0.24.0"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

# the tray and media keys talk D-Bus, which only Linux desktops have
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# the tray, and a title bar colored like the app (Windows 11)
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

# the .exe's own icon, for Explorer, the desktop and the taskbar
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
